# Baseline Benchmark Configuration
logistic_regression:
  max_iter: 1000
  C: 0.5
  class_weight: "balanced"
  solver: "lbfgs"

random_forest:
  n_estimators: 100
  max_depth: 5
  min_samples_split: 4
  class_weight: "balanced"
  random_state: 42

xgboost:
  n_estimators: 80
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  eval_metric: "logloss"
  random_state: 42

gru_recurrent:
  input_dim: 35
  hidden_dim: 24
  num_layers: 1
  dropout: 0.1
  learning_rate: 0.01
  epochs: 25
  batch_size: 16
